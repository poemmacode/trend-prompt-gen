<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — TrendPrompt Engine</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="hero-sm">
    <div class="container">
      <a href="/" class="logo">TrendPrompt<span class="accent">Engine</span></a>
    </div>
  </header>

  <section class="auth-section">
    <div class="container">
      <div class="auth-card">
        <h1>Log in</h1>
        <p class="subtitle">Welcome back. Enter your credentials to continue.</p>

        <form id="login-form" class="form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" required>
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn">
            <span id="btn-text">Log in</span>
            <span id="btn-loading" class="hidden">Loading...</span>
          </button>
        </form>

        <div id="error" class="error hidden"></div>

        <p class="auth-link">Don't have an account? <a href="/signup">Sign up</a></p>
      </div>
    </div>
  </section>

  <script>
    const form = document.getElementById("login-form");
    const errorDiv = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");
    const btnText = document.getElementById("btn-text");
    const btnLoading = document.getElementById("btn-loading");

    // Redirect if already logged in
    if (localStorage.getItem("sb-access-token")) {
      window.location.href = "/dashboard";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorDiv.classList.add("hidden");
      submitBtn.disabled = true;
      btnText.classList.add("hidden");
      btnLoading.classList.remove("hidden");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (data.error) {
          errorDiv.textContent = data.error;
          errorDiv.classList.remove("hidden");
          return;
        }

        localStorage.setItem("sb-access-token", data.access_token);
        localStorage.setItem("sb-user-id", data.user_id);
        window.location.href = "/dashboard";
      } catch (err) {
        errorDiv.textContent = "Network error. Please try again.";
        errorDiv.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        btnText.classList.remove("hidden");
        btnLoading.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
