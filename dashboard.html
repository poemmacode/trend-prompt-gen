<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — TrendPrompt Engine</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav-header">
    <div class="container nav">
      <a href="/" class="logo">TrendPrompt<span class="accent">Engine</span></a>
      <div class="nav-right">
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn" class="btn btn-secondary btn-sm">Logout</button>
      </div>
    </div>
  </header>

  <section class="dashboard-section">
    <div class="container">
      <!-- API Key Setup -->
      <div id="api-key-setup" class="card">
        <h2>Connect your OpenAI API key</h2>
        <p class="subtitle">We need your key to generate prompts. It's stored securely and only used for your requests.</p>
        <form id="api-key-form" class="form-inline">
          <input type="password" id="api-key-input" placeholder="sk-..." class="input-lg">
          <button type="submit" class="btn btn-primary">Save key</button>
        </form>
        <div id="api-key-status" class="status hidden"></div>
      </div>

      <!-- Report Generator -->
      <div id="generator" class="card">
        <h2>Generate prompts</h2>
        <p class="subtitle">Enter a market niche and get AI image prompts based on current trends.</p>
        <form id="trend-form" class="form-inline">
          <input type="text" id="niche" placeholder="e.g. plant moms, pet portraits, vintage..." class="input-lg">
          <button type="submit" class="btn btn-primary" id="generate-btn">
            <span id="gen-text">Generate</span>
            <span id="gen-loading" class="hidden">Generating...</span>
          </button>
        </form>
      </div>

      <!-- Results -->
      <div id="results" class="card hidden">
        <div class="results-header">
          <h2>Your report</h2>
          <button id="copy-btn" class="btn btn-secondary btn-sm">Copy report</button>
        </div>
        <div id="report-content" class="report-content"></div>
      </div>

      <div id="error" class="error hidden"></div>
    </div>
  </section>

  <script>
    const token = localStorage.getItem("sb-access-token");
    if (!token) window.location.href = "/login";

    const userEmail = document.getElementById("user-email");
    const logoutBtn = document.getElementById("logout-btn");
    const apiKeyForm = document.getElementById("api-key-form");
    const apiKeyInput = document.getElementById("api-key-input");
    const apiKeyStatus = document.getElementById("api-key-status");
    const generator = document.getElementById("generator");
    const trendForm = document.getElementById("trend-form");
    const results = document.getElementById("results");
    const reportContent = document.getElementById("report-content");
    const errorDiv = document.getElementById("error");
    const copyBtn = document.getElementById("copy-btn");

    // Load user info
    fetch("/api/v1/auth/me", {
      headers: { Authorization: `Bearer ${token}` },
    })
      .then((r) => r.json())
      .then((data) => {
        if (data.email) userEmail.textContent = data.email;
      });

    // Check if API key is saved
    fetch("/api/v1/api-keys", {
      headers: { Authorization: `Bearer ${token}` },
    })
      .then((r) => r.json())
      .then((data) => {
        if (data.api_key) {
          apiKeyStatus.textContent = "API key saved";
          apiKeyStatus.classList.remove("hidden", "error");
          apiKeyStatus.classList.add("success");
          generator.classList.remove("hidden");
        }
      });

    // Save API key
    apiKeyForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const key = apiKeyInput.value.trim();
      if (!key) return;

      const res = await fetch("/api/v1/api-keys", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ api_key: key }),
      });

      const data = await res.json();
      if (data.status === "saved") {
        apiKeyStatus.textContent = "API key saved";
        apiKeyStatus.classList.remove("hidden", "error");
        apiKeyStatus.classList.add("success");
        generator.classList.remove("hidden");
        apiKeyInput.value = "";
      }
    });

    // Generate report
    trendForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();
      results.classList.add("hidden");

      const niche = document.getElementById("niche").value.trim();
      if (!niche) return;

      document.getElementById("generate-btn").disabled = true;
      document.getElementById("gen-text").classList.add("hidden");
      document.getElementById("gen-loading").classList.remove("hidden");

      try {
        const params = new URLSearchParams({ niche });
        const res = await fetch(`/api/v1/report?${params.toString()}`, {
          method: "POST",
          headers: { Authorization: `Bearer ${token}` },
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          showError(data.detail || data.error || "Error generating report");
          return;
        }

        reportContent.textContent = data.report;
        results.classList.remove("hidden");
      } catch (err) {
        showError("Network error. Please try again.");
      } finally {
        document.getElementById("generate-btn").disabled = false;
        document.getElementById("gen-text").classList.remove("hidden");
        document.getElementById("gen-loading").classList.add("hidden");
      }
    });

    // Copy report
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(reportContent.textContent).then(() => {
        copyBtn.textContent = "Copied!";
        setTimeout(() => (copyBtn.textContent = "Copy report"), 2000);
      });
    });

    // Logout
    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("sb-access-token");
      localStorage.removeItem("sb-user-id");
      window.location.href = "/login";
    });

    function showError(msg) {
      errorDiv.textContent = msg;
      errorDiv.classList.remove("hidden");
    }
    function hideError() {
      errorDiv.classList.add("hidden");
    }
  </script>
</body>
</html>
